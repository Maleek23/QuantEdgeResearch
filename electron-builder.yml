appId: com.quantedgelabs.desktop
productName: Quant Edge Labs
copyright: Copyright © 2024 Quant Edge Labs

directories:
  output: desktop-dist
  buildResources: electron/resources

files:
  - electron/**/*
  - dist/**/*
  - server/**/*
  - shared/**/*
  - package.json
  - node_modules/**/*

extraMetadata:
  main: electron/main.js

mac:
  category: public.app-category.finance
  target:
    - dmg
    - zip
  darkModeSupport: true

win:
  target:
    - nsis
    - portable
  icon: electron/resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  category: Finance
  target:
    - AppImage
    - deb
  desktop:
    StartupWMClass: quant-edge-labs

asar: false
