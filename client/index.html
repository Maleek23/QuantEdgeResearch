    <!-- VISUAL MODE before first paint (client/src/lib/visual-mode.ts is the
         source of truth — keep the key, the legacy migration and the classes in
         sync with it). Sets html[data-mode] + the legacy classes so the boot
         screen and the first React frame are already on the saved ground. -->
    <script>
      (function () {
        var h = document.documentElement, m = 'dark';
        try {
          m = localStorage.getItem('qe-mode') || '';
          if (!/^(dark|midnight|dim|light|contrast)$/.test(m)) {
            var t = localStorage.getItem('quantedge-theme') || '';
            m = /light/.test(t) ? 'light'
              : t === 'night' ? 'midnight'
              : t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light'
              : 'dark';
          }
        } catch (e) { m = 'dark'; }
        h.setAttribute('data-mode', m);
        h.className += (m === 'light' ? ' light terminal-nexus-light' : ' dark terminal-nexus');
        h.style.colorScheme = m === 'light' ? 'light' : 'dark';
        var g = { dark: '#06070a', midnight: '#000000', dim: '#1a1e26', light: '#f2f5f9', contrast: '#000000' }[m];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && g) meta.setAttribute('content', g);
      })();
    </script>

    <!-- BOOT SCREEN — the one branded loader (docs/DESIGN_SYSTEM.md "Loading").
         It stays up until the first page can paint (client/src/lib/boot.ts),
         then fades out once (150ms; instant under reduced motion). Every later
         load is a page/tool skeleton inside the mounted shell. -->
    <style>
      html{background:#06070a}html[data-mode=midnight],html[data-mode=contrast]{background:#000}html[data-mode=dim]{background:#1a1e26}html[data-mode=light]{background:#f2f5f9}
      #app-loader{--b-bg:#06070a;--b-fg:#8a93a6;--b-name:#e8ecf3;--b-acc:#3b8cff;--b-track:rgba(138,147,166,.18);position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--b-bg);color:var(--b-fg);font-family:'JetBrains Mono',ui-monospace,monospace;transition:opacity .15s ease-out}
      html[data-mode=midnight] #app-loader{--b-bg:#000;--b-fg:#868e9d;--b-name:#d6dbe4}
      html[data-mode=dim] #app-loader{--b-bg:#1a1e26;--b-fg:#a2abba;--b-name:#e6e9ef;--b-acc:#66a4ff;--b-track:rgba(162,171,186,.22)}
      html[data-mode=light] #app-loader{--b-bg:#f2f5f9;--b-fg:#5b6475;--b-name:#0e1726;--b-acc:#1a63d1;--b-track:rgba(70,83,107,.18)}
      html[data-mode=contrast] #app-loader{--b-bg:#000;--b-fg:#cdd3dd;--b-name:#fff;--b-acc:#7ab2ff;--b-track:#3a3f4a}
      #app-loader.out{opacity:0;pointer-events:none}
      #app-loader .qe-boot-mark{display:flex;align-items:center;gap:10px}
      #app-loader .qe-boot-mark img{width:28px;height:28px}
      #app-loader .qe-boot-name{font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--b-name)}
      #app-loader .qe-boot-sub{font-size:10px;letter-spacing:.18em;color:var(--b-acc)}
      #app-loader .qe-boot-track{position:relative;width:148px;height:2px;border-radius:2px;background:var(--b-track);overflow:hidden}
      #app-loader .qe-boot-track i{position:absolute;top:0;bottom:0;width:40%;border-radius:2px;background:var(--b-acc);animation:qe-boot-slide 1.1s ease-in-out infinite}
      #app-loader p{margin:0;font-size:11px;max-width:90vw}
      @keyframes qe-boot-slide{from{left:-40%}to{left:100%}}
      @media (prefers-reduced-motion:reduce){#app-loader{transition:none}#app-loader .qe-boot-track i{animation:none;left:30%}}
    </style>
  </head>
  <body>
    <div id="app-loader" role="status" aria-label="Loading QuantEdge">
      <div class="qe-boot-mark"><img src="/favicon.svg" alt="" width="28" height="28" /><span class="qe-boot-name">QUANTEDGE</span><span class="qe-boot-sub">// TERMINAL</span></div>
      <div class="qe-boot-track" aria-hidden="true"><i></i></div>
      <p></p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Track if main module loaded
      window.__QE_LOADED = false;
      window.__QE_ERRORS = [];

      // Catch ALL errors
      window.addEventListener('error', function(e) {
        window.__QE_ERRORS.push('ERR: ' + (e.message || '') + ' ' + (e.filename || '') + ':' + (e.lineno || ''));
      }, true); // capture phase to catch script load errors too
      window.addEventListener('unhandledrejection', function(e) {
        window.__QE_ERRORS.push('REJ: ' + (e.reason && e.reason.message || e.reason || 'unknown'));
      });

      // Check at 5s and show diagnostic
      setTimeout(function() {
        var root = document.getElementById('root');
        var loader = document.getElementById('app-loader');
        if (!loader) return; // React already took over

        var hasChildren = root && root.hasChildNodes();
        if (hasChildren) return; // App mounted fine

        // Gather diagnostic info
        var diag = [];
        diag.push('Module loaded: ' + (window.__QE_LOADED ? 'YES' : 'NO'));
        diag.push('Errors: ' + (window.__QE_ERRORS.length ? window.__QE_ERRORS.join(' | ') : 'none'));

        // Check what scripts actually loaded
        var scripts = document.querySelectorAll('script[type="module"]');
        scripts.forEach(function(s) { diag.push('Script: ' + (s.src || 'inline')); });

        var track = loader.querySelector('.qe-boot-track');
        if (track) track.style.display = 'none';
        loader.querySelector('p').style.wordBreak = 'break-all';
        loader.querySelector('p').innerHTML =
          '<span style="color:#ef4444;font-size:14px">App failed to load</span><br><br>' +
          '<span style="color:#64748b;font-size:10px">' + diag.join('<br>') + '</span><br><br>' +
          '<a href="javascript:sessionStorage.clear();caches&&caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})});location.reload(true)" style="color:#10b981;text-decoration:underline;font-size:13px">Clear everything & reload</a>';
      }, 5000);
    </script>
  </body>
