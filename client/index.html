    <!-- VISUAL MODE before first paint (client/src/lib/visual-mode.ts is the
         source of truth — keep the key, the legacy migration and the classes in
         sync with it). Sets html[data-mode] + the legacy classes so the boot
         screen and the first React frame are already on the saved ground. -->
    <script>
      (function () {
        var h = document.documentElement, m = 'dark';
        var sys = function () { try { return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { return 'dark'; } };
        try {
          m = localStorage.getItem('qe-mode') || '';
          if (m === 'system') m = sys();
          else if (!/^(dark|midnight|dim|light|contrast)$/.test(m)) {
            // no choice yet → follow the OS (default preference 'system')
            var t = localStorage.getItem('quantedge-theme') || '';
            m = !t || t === 'system' ? sys()
              : /light/.test(t) ? 'light'
              : t === 'night' ? 'midnight'
              : 'dark';
          }
        } catch (e) { m = sys(); }
        h.setAttribute('data-mode', m);
        h.className += (m === 'light' ? ' light terminal-nexus-light' : ' dark terminal-nexus');
        h.style.colorScheme = m === 'light' ? 'light' : 'dark';
        var g = { dark: '#06070a', midnight: '#000000', dim: '#1a1e26', light: '#f2f5f9', contrast: '#000000' }[m];
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && g) meta.setAttribute('content', g);
      })();
    </script>

    <!-- BOOT SCREEN — the one branded loader (docs/DESIGN_SYSTEM.md "Loading").
         It stays up until the first page can paint (client/src/lib/boot.ts),
         then fades out once (150ms; instant under reduced motion). Every later
         load is a page/tool skeleton inside the mounted shell. -->
    <style>
      html{background:#06070a}html[data-mode=midnight],html[data-mode=contrast]{background:#000}html[data-mode=dim]{background:#1a1e26}html[data-mode=light]{background:#f2f5f9}
      #app-loader{--b-bg:#06070a;--b-fg:#8a93a6;--b-name:#e8ecf3;--b-acc:#3b8cff;--b-track:rgba(138,147,166,.18);position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--b-bg);color:var(--b-fg);font-family:'JetBrains Mono',ui-monospace,monospace;transition:opacity .15s ease-out}
      html[data-mode=midnight] #app-loader{--b-bg:#000;--b-fg:#868e9d;--b-name:#d6dbe4}
      html[data-mode=dim] #app-loader{--b-bg:#1a1e26;--b-fg:#a2abba;--b-name:#e6e9ef;--b-acc:#66a4ff;--b-track:rgba(162,171,186,.22)}
      html[data-mode=light] #app-loader{--b-bg:#f2f5f9;--b-fg:#5b6475;--b-name:#0e1726;--b-acc:#1a63d1;--b-track:rgba(70,83,107,.18)}
      html[data-mode=contrast] #app-loader{--b-bg:#000;--b-fg:#cdd3dd;--b-name:#fff;--b-acc:#7ab2ff;--b-track:#3a3f4a}
      /* gamma mark — the second logo: puts below (orange), calls above (blue), rolling as a wave */
      #app-loader{--b-call:#2f5aa8;--b-put:#9a4430}
      html[data-mode=light] #app-loader{--b-call:#2a5bb8;--b-put:#b4532f}
      html[data-mode=contrast] #app-loader{--b-call:#5b93ff;--b-put:#ff8a5c}
      #app-loader .qe-boot-gamma{display:block;max-width:70vw;height:auto}
      #app-loader .qe-boot-gamma rect{transform-box:fill-box;animation:qe-boot-wave 1.6s ease-in-out infinite}
      #app-loader .qe-boot-gamma rect.c{fill:var(--b-call);transform-origin:50% 100%}
      #app-loader .qe-boot-gamma rect.p{fill:var(--b-put);transform-origin:50% 0%}
      @keyframes qe-boot-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
      @media (prefers-reduced-motion:reduce){#app-loader .qe-boot-gamma rect{animation:none}}
      #app-loader.out{opacity:0;pointer-events:none}
      #app-loader .qe-boot-mark{display:flex;align-items:center;gap:10px}
      #app-loader .qe-boot-mark img{width:28px;height:28px}
      #app-loader .qe-boot-name{font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--b-name)}
      #app-loader .qe-boot-sub{font-size:10px;letter-spacing:.18em;color:var(--b-acc)}
      #app-loader .qe-boot-track{position:relative;width:148px;height:2px;border-radius:2px;background:var(--b-track);overflow:hidden}
      #app-loader .qe-boot-track i{position:absolute;top:0;bottom:0;width:40%;border-radius:2px;background:var(--b-acc);animation:qe-boot-slide 1.1s ease-in-out infinite}
      #app-loader p{margin:0;font-size:11px;max-width:90vw}
      @keyframes qe-boot-slide{from{left:-40%}to{left:100%}}
      @media (prefers-reduced-motion:reduce){#app-loader{transition:none}#app-loader .qe-boot-track i{animation:none;left:30%}}
      /* LANDING SKELETON — `/` for a visitor (critical CSS for the landing's first paint).
         The landing's nav + hero as text-free blocks on the landing ground
         (styles/landing-v2.css tokens), until the landing mounts with its stylesheet
         (lib/boot.ts releaseLandingSkeleton). Dark unless html[data-mode=light]. */
      #qe-landing-skel{--s-bg:#07080b;--s-bg2:#0b0d11;--s-line:rgba(255,255,255,.075);--s-blk:rgba(255,255,255,.07);--s-blk2:rgba(255,255,255,.035);--s-acc:rgba(37,99,235,.55);position:fixed;inset:0;z-index:9998;overflow:hidden;background:var(--s-bg);transition:opacity .15s ease-out}
      html[data-mode=light] #qe-landing-skel{--s-bg:#fafaf8;--s-bg2:#f3f3f0;--s-line:rgba(12,18,32,.085);--s-blk:rgba(12,18,32,.075);--s-blk2:rgba(12,18,32,.04);--s-acc:rgba(29,95,214,.5)}
      #qe-landing-skel.out{opacity:0;pointer-events:none}
      #qe-landing-skel[hidden]{display:none}
      #qe-landing-skel i{display:block;border-radius:8px;background:var(--s-blk)}
      #qe-landing-skel .a{height:38px;border-bottom:1px solid var(--s-line);background:var(--s-bg2);display:flex;align-items:center;justify-content:center}
      #qe-landing-skel .a i{width:min(420px,70vw);height:10px;background:var(--s-blk2)}
      #qe-landing-skel .n{max-width:1180px;margin:0 auto;padding:10px 32px;min-height:64px;display:flex;align-items:center;gap:28px}
      #qe-landing-skel .n .lg{width:120px;height:22px}
      #qe-landing-skel .n .ln{width:64px;height:10px;background:var(--s-blk2)}
      #qe-landing-skel .n .sp{flex:1;background:none}
      #qe-landing-skel .n .bt{width:104px;height:40px;border-radius:10px;background:var(--s-acc)}
      #qe-landing-skel .h{display:flex;flex-direction:column;align-items:center;padding:120px 32px 0}
      #qe-landing-skel .h .bd{width:260px;height:30px;border-radius:999px;background:var(--s-blk2);border:1px solid var(--s-line)}
      #qe-landing-skel .h .t1{width:min(400px,80vw);height:64px;margin-top:56px;border-radius:12px}
      #qe-landing-skel .h .t2{width:min(540px,86vw);height:64px;margin-top:18px;border-radius:12px;background:var(--s-blk2)}
      #qe-landing-skel .h .s{width:min(600px,88vw);height:14px;margin-top:40px;background:var(--s-blk2)}
      #qe-landing-skel .h .s+.s{width:min(480px,72vw);margin-top:14px}
      #qe-landing-skel .c{display:flex;gap:12px;margin-top:44px}
      #qe-landing-skel .c i{width:164px;height:52px;border-radius:10px;background:var(--s-blk2);border:1px solid var(--s-line)}
      #qe-landing-skel .c i:first-child{background:var(--s-acc);border:0}
      #qe-landing-skel .h,#qe-landing-skel .n{animation:qe-skel-pulse 1.6s ease-in-out infinite}
      @keyframes qe-skel-pulse{0%,100%{opacity:1}50%{opacity:.6}}
      @media (max-width:760px){#qe-landing-skel .n{padding:10px 16px;gap:12px}#qe-landing-skel .n .ln{display:none}#qe-landing-skel .h{padding:64px 16px 0;align-items:flex-start}#qe-landing-skel .h .t1,#qe-landing-skel .h .t2{height:44px}#qe-landing-skel .c{flex-direction:column;width:100%}#qe-landing-skel .c i{width:100%}}
      @media (prefers-reduced-motion:reduce){#qe-landing-skel{transition:none}#qe-landing-skel .h,#qe-landing-skel .n{animation:none}}
    </style>
  </head>

="51.7" rx="1"/><rect class="c" style="animation-delay:1.20s" x="201.5" y="22.4" width="7" height="38.0" rx="1"/><rect class="c" style="animation-delay:1.26s" x="211.5" y="36.4" width="7" height="23.9" rx="1"/><rect class="c" style="animation-delay:1.32s" x="221.5" y="47.5" width="7" height="12.9" rx="1"/><rect class="c" style="animation-delay:1.38s" x="231.5" y="54.4" width="7" height="6.0" rx="1"/><rect class="c" style="animation-delay:1.44s" x="241.5" y="58.0" width="7" height="2.4" rx="1"/><rect class="c" style="animation-delay:1.50s" x="251.5" y="59.2" width="7" height="1.2" rx="1"/></svg>
      <div class="qe-boot-track" aria-hidden="true"><i></i></div>

    <div id="qe-landing-skel" aria-hidden="true" hidden>
      <div class="a"><i></i></div>
      <div class="n"><i class="lg"></i><i class="ln"></i><i class="ln"></i><i class="ln"></i><i class="sp"></i><i class="bt"></i></div>
      <div class="h"><i class="bd"></i><i class="t1"></i><i class="t2"></i><i class="s"></i><i class="s"></i><div class="c"><i></i><i></i><i></i></div></div>
    </div>
    <script>
      // `/` for a visitor (no "signed in last time" hint — hooks/useAuth.ts): no boot splash.
      // The text-free landing skeleton covers the page until the landing mounts with its
      // stylesheet (lib/boot.ts releaseLandingSkeleton); 15 s cap so it can never trap anyone.
      // A landing demo frame (?qe-demo=1 in an iframe) gets neither.
      (function () {
        var bl = document.getElementById('app-loader'), sk = document.getElementById('qe-landing-skel'), visitor = false;
        try { visitor = location.pathname === '/' && localStorage.getItem('qe-auth-hint') !== '1'; } catch (e) { visitor = location.pathname === '/'; }
        var demo = /[?&]qe-demo=1/.test(location.search) && window.top !== window.self;
        if ((visitor || demo) && bl) bl.remove();
        if (visitor && !demo && sk) { sk.hidden = false; setTimeout(function () { if (sk.parentNode) sk.remove(); }, 15000); }
        else if (sk) sk.remove();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Track if main module loaded
      window.__QE_LOADED = false;
      window.__QE_ERRORS = [];

      // Catch ALL errors
      window.addEventListener('error', function(e) {
        window.__QE_ERRORS.push('ERR: ' + (e.message || '') + ' ' + (e.filename || '') + ':' + (e.lineno || ''));
      }, true); // capture phase to catch script load errors too
      window.addEventListener('unhandledrejection', function(e) {
        window.__QE_ERRORS.push('REJ: ' + (e.reason && e.reason.message || e.reason || 'unknown'));
      });

      // Check at 5s and show diagnostic
      setTimeout(function() {
        var root = document.getElementById('root');
        var loader = document.getElementById('app-loader');
        if (!loader) return; // React already took over

        var hasChildren = root && root.hasChildNodes();
        if (hasChildren) return; // App mounted fine

        // Gather diagnostic info
        var diag = [];
        diag.push('Module loaded: ' + (window.__QE_LOADED ? 'YES' : 'NO'));
        diag.push('Errors: ' + (window.__QE_ERRORS.length ? window.__QE_ERRORS.join(' | ') : 'none'));

        // Check what scripts actually loaded
        var scripts = document.querySelectorAll('script[type="module"]');
        scripts.forEach(function(s) { diag.push('Script: ' + (s.src || 'inline')); });

        var track = loader.querySelector('.qe-boot-track');
        if (track) track.style.display = 'none';
        // Member-facing copy first; script URLs / error text only behind "Details" (audit 2026-10-07 #9).
        var p = loader.querySelector('p');
        p.innerHTML =
          '<span style="color:#e8ecf3;font-size:15px;font-weight:600">QuantEdge didn\u2019t finish loading</span><br>' +
          '<span style="color:#8b93a3;font-size:13px">This is usually an out-of-date copy saved by your browser. Reloading fixes it.</span><br><br>' +
          '<button type="button" id="qe-boot-reload" style="min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid #3b8cff;background:rgba(59,140,255,.12);color:#e8ecf3;font-size:14px;cursor:pointer">Reload QuantEdge</button>' +
          '<details style="margin-top:14px;text-align:left;max-width:560px"><summary style="cursor:pointer;color:#8b93a3;font-size:12px;min-height:44px;line-height:44px">Details</summary>' +
          '<div id="qe-boot-diag" style="color:#7f889a;font-size:11px;word-break:break-all"></div></details>';
        var dd = document.getElementById('qe-boot-diag');
        if (dd) dd.textContent = diag.join(' \u00b7 ');
        var rb = document.getElementById('qe-boot-reload');
        if (rb) rb.addEventListener('click', function () {
          try { sessionStorage.clear(); } catch (e) {}
          var done = function () { location.reload(); };
          if (window.caches && caches.keys) caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }).then(done, done); else done();
        });
      }, 5000);
    </script>
